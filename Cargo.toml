[package]
name = "ttfx"
version = "0.3.2"
edition = "2021"
description = "Terminal text effects — a Rust port of terminaltexteffects (TTE)"
license = "MIT"

[lib]
# Host builds stay an rlib. `cargo test --release` compiles this lib twice
# (panic=abort for the binary, panic=unwind for the tests). A cdylib has no
# hash in its filename, so those two outputs are the same file, and macOS ld
# links that dylib when it links the CLI. The dylib does not export Rust
# symbols, so the link fails. Wasm builds pass `--crate-type cdylib`.
crate-type = ["rlib"]

[features]
default = ["all-effects"]
all-effects = [
    "beams",
    "binarypath",
    "blackhole",
    "bouncyballs",
    "bubbles",
    "burn",
    "colorshift",
    "crumble",
    "decrypt",
    "errorcorrect",
    "expand",
    "fireworks",
    "highlight",
    "laseretch",
    "matrix",
    "middleout",
    "orbittingvolley",
    "overflow",
    "pour",
    "print",
    "rain",
    "randomsequence",
    "rings",
    "scattered",
    "slice",
    "slide",
    "smoke",
    "spotlights",
    "spray",
    "swarm",
    "sweep",
    "synthgrid",
    "thunderstorm",
    "unstable",
    "vhstape",
    "waves",
    "wipe",
]
beams = []
binarypath = []
blackhole = []
bouncyballs = []
bubbles = []
burn = []
colorshift = []
crumble = []
decrypt = []
errorcorrect = []
expand = []
fireworks = []
highlight = []
laseretch = []
matrix = []
middleout = []
orbittingvolley = []
overflow = []
pour = []
print = []
rain = []
randomsequence = []
rings = []
scattered = []
slice = []
slide = []
smoke = []
spotlights = []
spray = []
swarm = []
sweep = []
synthgrid = []
thunderstorm = []
unstable = []
vhstape = []
waves = []
wipe = []

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
terminal_size = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.127"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
