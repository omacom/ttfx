[package]
name = "ttfx"
version = "0.5.0"
edition = "2021"
description = "Terminal text effects — a Rust port of terminaltexteffects (TTE)"
license = "MIT"

[lib]
# Host builds stay an rlib. Wasm builds pass `--crate-type cdylib`.
crate-type = ["rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
terminal_size = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
