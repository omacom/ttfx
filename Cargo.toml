[package]
name = "ttfx"
version = "0.3.3"
edition = "2021"
description = "Terminal text effects — a Rust port of terminaltexteffects (TTE)"
license = "MIT"

[features]
default = ["asm"]
# The x86-64 assembly engine (asm/). Needs NASM at build time; ignored on
# other targets.
asm = []

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.9"
terminal_size = "0.4"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
